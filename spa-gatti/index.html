<html>
  <head>

    <title>SPA gatti casuali</title>
    <style>
      .contenitore-gatto-casuale{
          text-align:center;
      }

      #gatto-casuale{
          height:400px;
          width:auto;
      }
      .btn{
        font-size:24px;
        background: darkorchid;
        border:1px solid darkorchid;
        padding:6px;
      }
      #btn-ricarica{
          font-size:24px;
          background-color: darkorchid;
          border-radius:4px;
          padding:6px;
      }
      #contenitore-bottoni{
        display:flex;
        justify-content: center;
      }
      #gatti-salvati{
        margin:50px;
        border:5px solid blueviolet;
        display:flex;
        justify-content: space-around;
        flex-wrap:wrap;

      }
    </style>
  </head>

  <body>
    <div id="contenitore-bottoni">
      <button id="btn-ricarica" class="btn">Nuovo gatto</button>
      <button id="btn-salva" class="btn">Salva</button>
    </div>
    <div class="contenitore-gatto-casuale">
        <img id="gatto-casuale" src="" alt="">
    </div>
    <div id="gatti-salvati">

    </div>
      <script>       
const imgGattoCasuale =document.getElementById("gatto-casuale");
const btnRicarica=document.getElementById("btn-ricarica");
const btnSalva=document.getElementById("btn-salva");
const divGattiSalvati=document.getElementById("gatti-salvati");
async function getRandomCat(){
  const url = "https://cataas.com/cat?json=true";
  const response = await fetch(url);
  console.log(response);
  if(response.ok){
    const body=await response.json();
    console.log(body);

    imgGattoCasuale.src=body.url;
  }

btnRicarica.addEventListener("click",getRandomCat);
btnSalva.addEventListener("click", salvaGatto);
}

    getRandomCat();

function salvaGatto(){
  const nuovaImg=document.createElement("img");
  nuovaImg.src=imgGattoCasuale.src;
  divGattiSalvati.append(nuovaImg);
}
      </script>

  </body>
</html>
